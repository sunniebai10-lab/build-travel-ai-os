<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f5ef" />
    <title>Travel OS</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        align-items: center;
        background: #f8f5ef;
        color: #1c1c1c;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        padding: 24px;
      }
      main {
        background: #ffffff;
        border: 1px solid #e9dfd2;
        border-radius: 24px;
        box-shadow: 0 18px 44px rgba(83, 58, 36, 0.08);
        max-width: 430px;
        padding: 32px 24px;
        text-align: center;
        width: 100%;
      }
      .eyebrow {
        color: #e88a4a;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 34px;
        line-height: 1.1;
        margin: 18px 0 0;
      }
      p {
        color: #7a746c;
        font-size: 15px;
        line-height: 1.7;
        margin: 18px 0 0;
      }
      button {
        appearance: none;
        background: #e88a4a;
        border: 0;
        border-radius: 12px;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        margin-top: 28px;
        padding: 14px 18px;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Travel OS</div>
      <h1>当前处于离线状态</h1>
      <p>网络恢复后，你可以继续同步旅程数据。</p>
      <button type="button" onclick="location.reload()">重新尝试</button>
    </main>
  </body>
</html>
